# harness.yaml — committed config, no secrets (design: Data and contracts).
region: us-west-2
backend: local                 # agentcore | local; --backend overrides per run
archive_uri: s3://team46evalharness-archiveda4cb258-qgbj570ey9mw  # CDK output ArchiveUri
local_archive_uri: file://./archive
local_exporter: console
lgnd_secret_id: arn:aws:secretsmanager:us-west-2:892605951158:secret:LgndGeoLoginB45FADD8-pJaQ232LszQT-hw8RFt  # CDK output LgndSecretArn
runtime_arn: arn:aws:bedrock-agentcore:us-west-2:892605951158:runtime/team46_eval_harness-VzYWReDy9h  # CDK output RuntimeArn
out_dir: out

models:
  sonnet:
    id: us.anthropic.claude-sonnet-5-5
    max_tokens: 16000
    request_fields: {thinking: {type: adaptive, display: summarized}, output_config: {effort: high}}

