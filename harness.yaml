# USD per million tokens, from the Bedrock pricing page (Global Cross-region Inference table, US West (Oregon)),
# read on 2026-11-03 from a screenshot the user provided. Our model ID uses the `us.` regional profile, whose rate
# may differ slightly from the global one.
prices_per_mtok:
  sonnet: {in: 2.0, out: 10.0}

rubric: null
scorer: none
