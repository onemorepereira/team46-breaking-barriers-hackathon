[project]
name = "team46-eval-harness"
version = "0.1.0"
description = "Track 1 evaluation harness: trace, summarize and score an agentic geospatial workflow"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "boto3>=1.43",
  "jinja2>=3.1",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-socket>=0.7",
  "moto[s3]>=5",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML",
  "boto3-stubs[s3]",
]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analysis", "harness", "agent"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["analysis", "harness"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
