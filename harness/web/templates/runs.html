{% extends "base.html" %}
{% block title %}Runs · {{ team }}{% endblock %}
{% block body %}
<div class="page-header d-print-none">
  <div class="container-xl">
    <div class="row g-2 align-items-center">
      <div class="col">
        <div class="page-pretitle">Archive</div>
        <h2 class="page-title">Runs</h2>
      </div>
      <div class="col-auto"><a href="/" class="btn btn-primary"><i class="ti ti-player-play me-1"></i>New run</a></div>
    </div>
  </div>
</div>
<div class="page-body">
  <div class="container-xl">
    <div class="card">
      <div class="table-responsive">
        <table class="table table-vcenter card-table table-hover">
          <thead><tr>
            <th>Started</th><th>Prompt</th><th>Model</th><th>Area</th><th>Status</th>
            <th class="text-end">Score</th><th>Confidence</th><th class="text-end">Agent $</th>
            <th class="text-end">Judging $</th><th class="text-end">Tool calls</th><th class="text-end">Runtime</th>
          </tr></thead>
          <tbody id="runs-body"><tr><td colspan="11" class="text-secondary">Loading the archive…</td></tr></tbody>
        </table>
      </div>
      <div class="card-footer d-flex align-items-center gap-3" id="runs-footer" hidden>
        <span class="text-secondary small" id="runs-count"></span>
        <button type="button" class="btn btn-sm ms-auto" id="runs-more" hidden><i class="ti ti-chevrons-down me-1"></i>Load more</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/runs.js"></script>{% endblock %}
