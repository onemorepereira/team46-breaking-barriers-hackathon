<style>
:root{--bg:#fff;--fg:#1d1d1f;--muted:#5f6368;--line:#e3e3e6;--ok:#137333;--warn:#a05a00;--bad:#b3261e;--chip:#f3f3f5}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--fg:#ececef;--muted:#a0a3a8;--line:#2c2c31;--ok:#7bd88f;--warn:#f0b45a;--bad:#ff8a80;--chip:#232328}}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;margin:0 auto;max-width:1100px;padding:24px 16px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:28px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.muted{color:var(--muted)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
code{background:var(--chip);padding:1px 5px;border-radius:4px;font-size:13px;word-break:break-all}
.banner{border:1px solid var(--warn);color:var(--warn);padding:8px 12px;border-radius:6px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{background:var(--chip);border-radius:8px;padding:8px 10px}.tile b{display:block;font-size:18px}
.answer h1,.answer h2,.answer h3,.answer h4{font-size:15px;border:0;margin:18px 0 6px;padding:0}
.answer table{margin:8px 0}.answer p,.answer ul,.answer ol{margin:8px 0}
pre.raw{background:var(--chip);border-radius:6px;padding:10px 12px;overflow-x:auto;font-size:12.5px;white-space:pre-wrap;word-break:break-word}
details{margin:10px 0}summary{cursor:pointer}
</style>
